<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="'Courier New', 'Consolas', 'DejaVu Sans Mono', monospace">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E90FF"/>
      <stop offset="1" stop-color="#00C0FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- window -->
  <rect x="6" y="6" width="888" height="248" rx="12" fill="#0d1117" stroke="url(#border)" stroke-width="2"/>

  <!-- title bar -->
  <path d="M6 18 a12 12 0 0 1 12 -12 h864 a12 12 0 0 1 12 12 v22 h-888 z" fill="#161b22"/>
  <circle cx="30" cy="23" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="23" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="23" r="6" fill="#27c93f"/>
  <text x="450" y="27" text-anchor="middle" fill="#8b949e" font-size="13">hector@afrl: ~/portfolio — bash</text>
  <text x="876" y="27" text-anchor="end" fill="#3fb950" font-size="11" letter-spacing="1">FREQ 140.85</text>

  <!-- body -->
  <text x="28" y="82" font-size="16" fill="#3fb950">$ <tspan fill="#58a6ff">whoami</tspan></text>
  <text x="28" y="122" font-size="30" font-weight="bold" fill="#e6edf3" filter="url(#glow)">Hector Lugo III</text>
  <text x="28" y="154" font-size="15" fill="#8b949e">&gt; M.S. Computer Science @ UTRGV</text>
  <text x="28" y="178" font-size="15" fill="#8b949e">&gt; Reinforcement Learning · Computer Vision · VLMs for Robotics</text>
  <text x="28" y="202" font-size="15" fill="#8b949e">&gt; AI/ML Research Intern @ Air Force Research Laboratory</text>

  <!-- prompt + blinking cursor -->
  <text x="28" y="234" font-size="16" fill="#3fb950">$</text>
  <rect x="44" y="223" width="9" height="14" fill="#e6edf3">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
