name: GitHub Profile 3D Contrib

on:
  # Auto-build on pushes to main (ignore the bot's own output commits to avoid loops).
  push:
    branches: [main]
    paths-ignore:
      - 'profile-3d-contrib/**'
  schedule:
    - cron: "0 18 * * *"   # daily at 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push generated SVGs
        run: |
          git config user.name "Wavy-Hec"
          git config user.email "hlugo576@gmail.com"
          git add profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore: update 3D contribution calendar"
          git push
