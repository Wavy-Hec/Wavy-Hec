name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * 1"   # every Monday at 00:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Wavy-Hec
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Push generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          # commit the generated SVGs as the profile owner, not github-actions[bot],
          # so the bot never appears in the contributors box
          author: "Wavy-Hec <hlugo576@gmail.com>"
          committer: "Wavy-Hec <hlugo576@gmail.com>"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
